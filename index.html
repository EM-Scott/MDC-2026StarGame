<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINE 自動抽選助手 (切回觸發版)</title>
  <style>
    :root {
      --primary: #06C755;
      --primary-dark: #05b34c;
      --bg: #f5f5f5;
      --card: #ffffff;
      --text: #333333;
      --text-muted: #888888;
      --border: #e0e0e0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 15px;
      line-height: 1.5;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 { font-size: 1.3rem; margin-bottom: 5px; color: var(--text); }
    .subtitle { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px; }
    
    /* 模式切換區 */
    .mode-panel {
      background: var(--card);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      border: 1px solid var(--border);
    }
    .mode-title { font-weight: bold; margin-bottom: 10px; font-size: 0.95rem; }
    .mode-options {
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px dashed var(--border);
    }
    .mode-label {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.9rem;
    }
    
    /* 自動連抽控制區 */
    .auto-controls {
      display: none;
      background: #e6f9ed;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #bcead0;
      flex-direction: column;
      gap: 10px;
    }
    .auto-controls.active { display: flex; }
    .controls-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }
    
    /* 設定選項 */
    .setting-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      color: #155724;
      background: #d4edda;
      padding: 6px 10px;
      border-radius: 4px;
    }
    .setting-group select {
      padding: 2px 6px;
      border: 1px solid #c3e6cb;
      border-radius: 4px;
      font-weight: bold;
      outline: none;
    }

    .btn-auto {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
      transition: background 0.2s;
    }
    .btn-auto:hover { background: var(--primary-dark); }
    .btn-auto.stop { background: #dc3545; }
    .btn-auto.stop:hover { background: #c82333; }
    
    /* 狀態提示文字 */
    #autoStatusText {
      font-size: 0.85rem;
      font-weight: bold;
      color: #d39e00;
      background: #fff3cd;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #ffeeba;
      display: none;
    }

    /* 來源篩選 */
    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 15px;
    }
    .filter-btn {
      border: 1px solid var(--border);
      background: var(--card);
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text);
    }
    .filter-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* 列表 */
    .store-list { display: flex; flex-direction: column; gap: 8px; }
    .store-card {
      background: var(--card);
      padding: 12px 15px;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
    }
    .store-card.visited { background: #f0f0f0; opacity: 0.7; }
    .store-card.looping { border: 2px solid var(--primary); background: #f0fdf4; box-shadow: 0 0 8px rgba(6,199,85,0.3); }
    .store-info { display: flex; flex-direction: column; }
    .store-source { font-size: 0.75rem; color: #007bff; background: #e9ecef; padding: 2px 6px; border-radius: 4px; align-self: flex-start; margin-bottom: 4px;}
    .store-code { font-weight: bold; font-size: 1rem; }
    .store-id { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px;}
    
    .add-btn {
      background: var(--primary);
      color: white;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.85rem;
      text-align: center;
      min-width: 80px;
    }
    .add-btn.visited { background: #cccccc; pointer-events: none; }

    #loading { text-align: center; padding: 20px; color: var(--text-muted); }
  </style>
</head>
<body>

<div class="container">
  <h1>LINE 連結一鍵開啟助手</h1>
  <p class="subtitle">開啟連結後，請手動切換回本網頁，系統才會開始倒數並開啟下一個！</p>

  <!-- 模式控制面板 -->
  <div class="mode-panel">
    <div class="mode-title">開啟模式設定</div>
    <div class="mode-options">
      <label class="mode-label">
        <input type="radio" name="mode" value="manual" checked onchange="toggleMode()"> 
        👆 手動點擊（預設）
      </label>
      <label class="mode-label">
        <input type="radio" name="mode" value="auto" onchange="toggleMode()"> 
        ⚡ 切回視窗觸發連抽
      </label>
    </div>
    
    <div id="autoControls" class="auto-controls">
      <div class="controls-row">
        <div class="setting-group">
          <label for="intervalSelect">⏳ 切回後等待秒數 :</label>
          <select id="intervalSelect">
            <option value="1">1 秒</option>
            <option value="2">2 秒</option>
            <option value="3" selected>3 秒</option>
            <option value="5">5 秒</option>
            <option value="8">8 秒</option>
          </select>
        </div>
        <button id="startBtn" class="btn-auto" onclick="startAuto()">▶ 開始自動開啟</button>
        <button id="stopBtn" class="btn-auto stop" style="display:none;" onclick="stopAuto()">⏹ 停止</button>
        <button class="btn-auto" style="background:#6c757d;" onclick="resetVisited()">🔄 重置紀錄</button>
      </div>
      <!-- 提示文字列 -->
      <div id="autoStatusText">準備就緒...</div>
    </div>
  </div>

  <div id="loading">載入資料中 (codes.json)...</div>

  <div class="filter-group" id="filterGroup" style="display: none;"></div>
  <div class="store-list" id="storeContainer"></div>
</div>

<script>
  let itemsData = [];
  let currentSource = 'ALL';
  let unvisitedQueue = [];
  let queueIndex = 0;
  
  // 自動控制狀態變數
  let isAutoRunning = false;
  let isWaitingForReturn = false; // 是否正在等待使用者切回網頁
  let isCountingDown = false;   // 是否正在倒數中
  let countdownTimer = null;
  let remainingSeconds = 0;

  async function loadData() {
    try {
      const response = await fetch('./codes.json');
      if (!response.ok) throw new Error('Network response was not ok');
      itemsData = await response.json();
      
      document.getElementById('loading').style.display = 'none';
      document.getElementById('filterGroup').style.display = 'flex';
      render();
    } catch (error) {
      console.error('Fetch error:', error);
      document.getElementById('loading').innerHTML = `
        <span style="color:red">無法載入 codes.json！</span><br>
        <small>請確認 codes.json 與此網頁放在同一個資料夾。建議使用 Live Server 開啟以避免 CORS 問題。</small>
      `;
    }
  }

  function getVisited() { return JSON.parse(localStorage.getItem('line_items_visited') || '[]'); }
  function markVisited(id) {
    const visited = getVisited();
    if (!visited.includes(id)) {
      visited.push(id);
      localStorage.setItem('line_items_visited', JSON.stringify(visited));
      render();
    }
  }
  function resetVisited() {
    if(confirm('確定要清除所有點擊紀錄嗎？')) {
      localStorage.removeItem('line_items_visited');
      render();
    }
  }

  function toggleMode() {
    const isAuto = document.querySelector('input[name="mode"]:checked').value === 'auto';
    document.getElementById('autoControls').classList.toggle('active', isAuto);
    if (!isAuto) stopAuto();
  }

  // --- 自動開啟核心邏輯 ---

  function startAuto() {
    const visited = getVisited();
    const filteredItems = currentSource === 'ALL' ? itemsData : itemsData.filter(s => s.source === currentSource);
    unvisitedQueue = filteredItems.filter(s => !visited.includes(s.id));

    if (unvisitedQueue.length === 0) {
      alert("當前分類的連結均已開啟完畢！");
      return;
    }

    isAutoRunning = true;
    queueIndex = 0;
    
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('stopBtn').style.display = 'inline-block';
    document.getElementById('intervalSelect').disabled = true;
    document.getElementById('autoStatusText').style.display = 'inline-block';

    // 立即執行第一筆
    triggerNextItem();
  }

  function triggerNextItem() {
    if (queueIndex >= unvisitedQueue.length) {
      stopAuto();
      document.getElementById('autoStatusText').innerText = "🎉 所有連結均已開啟完畢！";
      alert("自動連抽已完成！");
      return;
    }

    const currentItem = unvisitedQueue[queueIndex];
    
    // UI 標記
    document.querySelectorAll('.store-card').forEach(c => c.classList.remove('looping'));
    const cardEl = document.getElementById(`card-${currentItem.id}`);
    if(cardEl) {
      cardEl.classList.add('looping');
      cardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // 狀態設定為等待切回
    isWaitingForReturn = true;
    document.getElementById('autoStatusText').innerText = "跳轉中... 請在 LINE 處理完畢後【切回本網頁】";
    document.getElementById('autoStatusText').style.backgroundColor = '#fff3cd';
    document.getElementById('autoStatusText').style.color = '#d39e00';

    // 標記並開啟 (固定同一個標籤頁 target)
    markVisited(currentItem.id);
    window.open(currentItem.url, 'line_auto_target');
  }

  // 偵測切回本網頁的處理函數
  function handleReturnToPage() {
    // 只有在連抽進行中，且正在等待使用者切回時才觸發
    if (!isAutoRunning || !isWaitingForReturn || isCountingDown) return;

    isWaitingForReturn = false;
    isCountingDown = true;
    
    // 讀取下拉選單秒數
    remainingSeconds = parseInt(document.getElementById('intervalSelect').value);
    
    const statusEl = document.getElementById('autoStatusText');
    statusEl.style.backgroundColor = '#d4edda';
    statusEl.style.color = '#155724';
    statusEl.innerText = `歡迎回來！倒數 ${remainingSeconds} 秒後開啟下一個...`;

    clearInterval(countdownTimer);
    countdownTimer = setInterval(() => {
      remainingSeconds--;
      if (remainingSeconds > 0) {
        statusEl.innerText = `歡迎回來！倒數 ${remainingSeconds} 秒後開啟下一個...`;
      } else {
        // 倒數結束，進入下一筆
        clearInterval(countdownTimer);
        isCountingDown = false;
        queueIndex++;
        triggerNextItem();
      }
    }, 1000);
  }

  // 監聽網頁可見性 (Visibility) 與焦點 (Focus)
  window.addEventListener('focus', handleReturnToPage);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') handleReturnToPage();
  });

  function stopAuto() {
    clearInterval(countdownTimer);
    isAutoRunning = false;
    isWaitingForReturn = false;
    isCountingDown = false;
    
    document.getElementById('startBtn').style.display = 'inline-block';
    document.getElementById('stopBtn').style.display = 'none';
    document.getElementById('intervalSelect').disabled = false;
    
    const statusEl = document.getElementById('autoStatusText');
    statusEl.innerText = "連抽已停止。";
    statusEl.style.backgroundColor = '#f8d7da';
    statusEl.style.color = '#721c24';
    
    document.querySelectorAll('.store-card').forEach(c => c.classList.remove('looping'));
  }

  // --- 畫面渲染相關 ---

  function filterBySource(source) {
    currentSource = source;
    render();
  }

  function render() {
    if(itemsData.length === 0) return;

    const visited = getVisited();
    const filterContainer = document.getElementById('filterGroup');
    const storeContainer = document.getElementById('storeContainer');

    itemsData.forEach(item => { if(!item.source) item.source = '未分類'; });
    const sources = ['ALL', ...new Set(itemsData.map(s => s.source))];
    
    filterContainer.innerHTML = sources.map(source => `
      <button class="filter-btn ${currentSource === source ? 'active' : ''}" onclick="filterBySource('${source}')">
        ${source === 'ALL' ? `全部(${itemsData.length})` : `${source}(${itemsData.filter(s => s.source === source).length})`}
      </button>
    `).join('');

    const filteredItems = currentSource === 'ALL' ? itemsData : itemsData.filter(s => s.source === currentSource);
    storeContainer.innerHTML = filteredItems.map((item) => {
      const isVisited = visited.includes(item.id);
      const displayCode = item.code ? `代碼: ${item.code}` : '無代碼';
      const isLooping = isAutoRunning && unvisitedQueue[queueIndex]?.id === item.id;
      
      return `
        <div class="store-card ${isVisited ? 'visited' : ''} ${isLooping ? 'looping' : ''}" id="card-${item.id}">
          <div class="store-info">
            <span class="store-source">${item.source}</span>
            <span class="store-code">${displayCode}</span>
            <span class="store-id">ID: ${item.id.substring(0,8)}... | 加入: ${item.addedAt || '未知'}</span>
          </div>
          <a href="${item.url}" 
             target="_blank" 
             class="add-btn ${isVisited ? 'visited' : ''}" 
             onclick="markVisited('${item.id}')">
            ${isVisited ? '已開啟' : '開啟'}
          </a>
        </div>
      `;
    }).join('');
  }

  loadData();
</script>

</body>
</html>
